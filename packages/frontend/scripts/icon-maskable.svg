<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ed6e8"/>
      <stop offset="1" stop-color="#4db6c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#123039"/>
      <stop offset="1" stop-color="#0b1116"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background so the launcher mask can crop to any shape. -->
