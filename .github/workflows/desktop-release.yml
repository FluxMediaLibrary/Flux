name: Publish Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build for
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows desktop release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FLUX_DISCORD_CLIENT_ID: ${{ vars.FLUX_DISCORD_CLIENT_ID }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match desktop version to release tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a semantic version such as v1.2.3."
          }
          npm version $version --workspace @flux/desktop --no-git-tag-version

      - name: Test desktop package
        run: npm test --workspace @flux/desktop

      - name: Build NSIS installer and update metadata
        run: npm run dist --workspace @flux/desktop

      - name: Upload desktop assets to GitHub Release
        shell: pwsh
        run: |
          $assets = Get-ChildItem apps/desktop/release -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -match '\.(exe|blockmap)$' } |
            Select-Object -ExpandProperty FullName
          if (-not $assets) { throw "No desktop release assets were produced." }
          gh release upload $env:RELEASE_TAG @assets --clobber
