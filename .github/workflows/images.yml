name: Publish Images

on:
  push:
    branches:
      - main
      - master
      - PROD
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"

          tags=("sha-${short_sha}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "PROD" ]]; then
            tags+=("latest")
          fi
          if [[ "${GITHUB_REF_NAME}" == "PROD" ]]; then
            tags+=("prod")
          fi

          {
            echo "backend_tags<<EOF"
            for tag in "${tags[@]}"; do echo "${image_base}-backend:${tag}"; done
            echo "EOF"
            echo "frontend_tags<<EOF"
            for tag in "${tags[@]}"; do echo "${image_base}-frontend:${tag}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
