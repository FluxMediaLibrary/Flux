name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - PROD

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://flux:flux@localhost:5432/flux?schema=public
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production
      TMDB_API_KEY: ci-placeholder
      REDIS_URL: redis://localhost:6379
      FRONTEND_ORIGIN: http://localhost:4938
      NEXT_PUBLIC_API_BASE_URL: http://localhost:6948
      PUBLIC_API_BASE_URL: http://localhost:6948

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/backend/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm test --workspace @flux/backend

      - name: Build
        run: npm run build
