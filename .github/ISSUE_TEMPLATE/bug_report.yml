name: Bug report
description: Report something that is broken or behaving incorrectly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a Flux issue. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
      placeholder: Describe the bug clearly.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Backend/API
        - Android app
        - Docker/self-hosting
        - Torrent/Transmission integration
        - Playback/streaming
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, commands, or screen flow that triggers the issue.
      placeholder: |
        1. Start Flux with ...
        2. Open ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions and runtime details that matter.
      placeholder: |
        Flux version/commit:
        Deployment: Docker Compose / local dev / VPS
        OS:
        Browser/device:
        Android version, if applicable:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs, browser console output, server errors, or screenshots. Remove secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens, API keys, and private hostnames from the report.
          required: true
        - label: I searched existing issues for a matching report.
          required: true
